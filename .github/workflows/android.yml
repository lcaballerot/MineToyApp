name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", ".dev-notes/**", "herramientas/**", ".github/badges/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: La etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(node -p "require('./package.json').version")"
          test "$v" = "$GITHUB_REF_NAME" || { echo "::error::la etiqueta $GITHUB_REF_NAME no es la versión $v"; exit 1; }

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --clean --no-install

      - name: Keystore de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::falta el secreto ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/minetoy.keystore"

      - name: Compilar el APK firmado
        working-directory: android
        env:
          CLAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLAVE_ALIAS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PMINETOY_KEYSTORE="$RUNNER_TEMP/minetoy.keystore" \
            -PMINETOY_KEYSTORE_CLAVE="$CLAVE_KEYSTORE" \
            -PMINETOY_ALIAS="$ALIAS" \
            -PMINETOY_ALIAS_CLAVE="$CLAVE_ALIAS"

      - name: Comprobar que va firmado con la clave de MineToy (no la de depuración)
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          firmante=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$firmante" verify --print-certs "$apk" | tee firma.txt
          grep -q "CN=MineToy" firma.txt || { echo "::error::el APK no va firmado con el keystore de MineToy"; exit 1; }

      - name: Preparar los ficheros
        run: |
          v="$(node -p "require('./package.json').version")"
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk "salida/MineToy-$v.apk"
          (cd salida && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: MineToy-android
          path: salida/
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {dentro=1; next} /^## / {dentro=0} dentro' CHANGELOG.md > notas.md
          test -s notas.md || { echo "::error::CHANGELOG.md no tiene la sección $v"; exit 1; }
          gh release create "$GITHUB_REF_NAME" salida/* --title "MineToy $v" --notes-file notas.md

  insignia:
    needs: apk
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Insignia de compilación
        run: |
          if [ "${{ needs.apk.result }}" = success ]; then es=correcta; en=passing; color=6eff4a; else es=fallida; en=failing; color=c93434; fi
          mkdir -p .github/badges
          base="https://img.shields.io/badge"
          curl -sfL "$base/compilaci%C3%B3n%20android-$es-$color?style=for-the-badge&logo=githubactions&logoColor=white" -o .github/badges/compilacion-android.svg
          curl -sfL "$base/build%20android-$en-$color?style=for-the-badge&logo=githubactions&logoColor=white" -o .github/badges/build-android.svg
          git add .github/badges
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=MineToy -c user.email=itzlightx@gmail.com commit -m "Insignia de compilación de Android: $es"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
