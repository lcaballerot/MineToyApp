name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", ".dev-notes/**", "herramientas/**", ".github/badges/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: La etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="v$(node -p "require('./package.json').version")"
          test "$v" = "$GITHUB_REF_NAME" || { echo "::error::la etiqueta $GITHUB_REF_NAME no es la versión $v"; exit 1; }

      - run: npm ci
      - run: npx tsc --noEmit
      # Reglas de seguridad (una prueba por regla) y ninguna vulnerabilidad crítica en lo que se instala.
      - run: npm test
      - run: npm audit --omit=dev --audit-level=critical
      - run: npx expo prebuild --platform android --clean --no-install

      - name: Keystore de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::falta el secreto ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/minetoy.keystore"

      - name: Compilar el APK firmado
        working-directory: android
        env:
          CLAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLAVE_ALIAS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PMINETOY_KEYSTORE="$RUNNER_TEMP/minetoy.keystore" \
            -PMINETOY_KEYSTORE_CLAVE="$CLAVE_KEYSTORE" \
            -PMINETOY_ALIAS="$ALIAS" \
            -PMINETOY_ALIAS_CLAVE="$CLAVE_ALIAS"

      - name: Comprobar que va firmado con la clave de MineToy (no la de depuración)
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          firmante=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$firmante" verify --print-certs "$apk" | tee firma.txt
          grep -q "CN=MineToy" firma.txt || { echo "::error::el APK no va firmado con el keystore de MineToy"; exit 1; }

      - name: Preparar los ficheros
        run: |
          v="$(node -p "require('./package.json').version")"
          mkdir -p salida
          cp android/app/build/outputs/apk/release/app-release.apk "salida/MineToy-$v.apk"
          (cd salida && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      # La cuota de artefactos es de toda la cuenta (otros repos la llenan): si no cabe, solo avisa. En las etiquetas el APK
      # va a la Release, que no cuenta en esa cuota.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MineToy-android
          path: salida/
          retention-days: 7

      # Prerelease que se rehace en cada push a main, como ios-pruebas (fuera de la cuota de artefactos).
      - name: Publicar en la prerelease android-pruebas
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-pruebas --yes --cleanup-tag 2>/dev/null || true
          {
            echo "APK de pruebas firmado con la clave de MineToy."
            echo
            echo "Commit \`${GITHUB_SHA::7}\`, $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "Test APK signed with the MineToy key."
          } > notas.md
          gh release create android-pruebas salida/* --prerelease --target "$GITHUB_SHA" --title "Android de pruebas" --notes-file notas.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {dentro=1; next} /^## / {dentro=0} dentro' CHANGELOG.md > notas.md
          test -s notas.md || { echo "::error::CHANGELOG.md no tiene la sección $v"; exit 1; }
          gh release create "$GITHUB_REF_NAME" salida/* --title "MineToy $v" --notes-file notas.md

  insignia:
    needs: apk
    if: always() && needs.apk.result != 'cancelled' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Insignia de compilación
        run: |
          # Copia de una plantilla del repo (shields.io rechaza a veces a los runners de GitHub: exit 22).
          if [ "${{ needs.apk.result }}" = success ]; then e=ok; es=correcta; else e=mal; es=fallida; fi
          cp .github/badges/plantillas/compilacion-android-$e.svg .github/badges/compilacion-android.svg
          cp .github/badges/plantillas/build-android-$e.svg .github/badges/build-android.svg
          git add .github/badges
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=MineToy -c user.email=itzlightx@gmail.com commit -m "Insignia de compilación de Android: $es"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
